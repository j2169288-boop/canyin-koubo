<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>修改访问密码 · 餐饮口播助手</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#fff7f0;color:#222}
.wrap{max-width:420px;margin:0 auto;padding:32px 20px}
h1{font-size:22px;margin:0 0 20px}
label{display:block;font-size:15px;margin:14px 0 6px}
input{width:100%;box-sizing:border-box;font-size:18px;padding:14px;border:1px solid #ddd;border-radius:12px}
button{width:100%;margin-top:22px;font-size:18px;padding:16px;border:0;border-radius:14px;background:#ff5a1f;color:#fff}
#msg{margin-top:16px;font-size:15px;min-height:20px}
a{color:#ff5a1f}
</style>
</head>
<body>
<div class="wrap">
<h1>修改访问密码</h1>
<form id="f">
<label for="new_password">新密码（至少 6 位）</label>
<input id="new_password" name="new_password" type="password" autocomplete="new-password" required>
<label for="confirm_password">再输一次</label>
<input id="confirm_password" name="confirm_password" type="password" autocomplete="new-password" required>
<button type="submit" id="save">保存新密码</button>
</form>
<div id="msg"></div>
<p><a href="/">返回首页</a></p>
</div>
<script>
document.getElementById('f').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  const r = await fetch('/api/password', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({new_password: document.getElementById('new_password').value,
                          confirm_password: document.getElementById('confirm_password').value})});
  const j = await r.json().catch(() => ({}));
  msg.textContent = j.ok ? '已保存，下次登录用新密码。' : ('保存失败：' + (j.error || r.status));
});
</script>
</body>
</html>
