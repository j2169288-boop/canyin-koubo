<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#e85d04" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="餐饮口播助手" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icons/icon-192.png" />
  <title>登录 · 餐饮口播助手</title>
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card card">
      <img class="logo" src="/static/icons/icon-192.png" alt="logo" width="72" height="72" />
      <h1>餐饮口播助手</h1>
      <p>商家手机端口播工具 · 请输入访问密码</p>
      <label for="password">访问密码</label>
      <input id="password" type="password" autocomplete="current-password" placeholder="请输入密码" />
      <div class="btn-row" style="margin-top:16px">
        <button class="btn btn-primary" id="btnLogin" type="button">进入</button>
      </div>
      <div id="err" class="banner danger hidden" style="margin-top:12px"></div>
      <p class="hint">可添加到手机主屏幕（Safari/Chrome → 分享 → 添加到主屏幕）</p>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <script src="/static/js/login.js"></script>
</body>
</html>
